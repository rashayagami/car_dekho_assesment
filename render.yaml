services:
  # ----------------------------------------------------
  # Express Backend Web Service
  # ----------------------------------------------------
  - type: web
    name: car-recommendation-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: postgresql://car_dekho:ktSMNBQmzvEBcYKef53A5QABvyRNP5g0@dpg-d8dj7828qa3s739p0460-a.singapore-postgres.render.com/car_dekho
      - key: GEMINI_API_KEY
        sync: false # Render will prompt the user to input their Gemini API Key during deployment
      - key: FRONTEND_URL
        sync: false # Render will prompt the user to input the final frontend URL for CORS

  # ----------------------------------------------------
  # React Frontend Static Site
  # ----------------------------------------------------
  - type: web
    name: car-recommendation-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://car-recommendation-backend.onrender.com/api
